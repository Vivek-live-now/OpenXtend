name: OpenXtend Android CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Android App & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Signed Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Upload OpenXtend Release APK (Play Protect Safe)
        uses: actions/upload-artifact@v4
        with:
          name: OpenXtend-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload OpenXtend Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenXtend-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
